USER_CONFIRMATION:
  subject: "Verify your account, {{ username }}"
  preheader: "One click more to activate your account."
  greeting: "Hello {{ username }}"
  intro: "Thank you for registering on {{ brand_name }}. Confirm this email to verify your new account"
